<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charlotte's Web — An Interactive Picture Book</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "./js/vendor/three/build/three.module.min.js"
  }
}
</script>
</head>
<body>
  <div id="table-scene">
    <div id="site-title">Charlotte's Web</div>
    <div id="drag-hint">Drag to spin the book around &middot; scroll to zoom</div>
    <canvas id="book-canvas"></canvas>
    <button id="open-btn">Open the Book ✨</button>
  </div>

  <div id="glossary-hint">✨ Tap a glowing word to find out what it means!</div>
  <div id="wand-hint">🪄 Tap the floating wand to pick it up, then drag to move it!</div>
  <button id="wand-cast-btn">✨ Cast Sparkles!</button>
  <div id="wand-dpad">
    <button class="dpad-btn dpad-up" data-dir="up" aria-label="Move wand away">▲</button>
    <button class="dpad-btn dpad-left" data-dir="left" aria-label="Move wand left">◀</button>
    <button class="dpad-btn dpad-right" data-dir="right" aria-label="Move wand right">▶</button>
    <button class="dpad-btn dpad-down" data-dir="down" aria-label="Move wand closer">▼</button>
  </div>

  <div id="controls">
    <button class="ctrl-btn" id="prev-btn">⟵ Prev</button>
    <button class="ctrl-btn" id="read-btn">🔊 Read to me</button>
    <span id="page-indicator">1-2 / 18</span>
    <button class="ctrl-btn" id="next-btn">Next ⟶</button>
  </div>

  <div id="read-dot"></div>

  <div id="word-popup" class="hidden">
    <div id="word-popup-card">
      <button id="word-popup-close" aria-label="Close">&times;</button>
      <div id="word-popup-icon"></div>
      <div id="word-popup-word"></div>
      <div id="word-popup-def"></div>
    </div>
  </div>

  <script src="js/illustrations.js"></script>
  <script src="js/book-data.js"></script>
  <script src="js/glossary.js"></script>
  <script type="module" src="js/three-book.js"></script>
</body>
</html>
